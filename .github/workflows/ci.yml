name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: apppw
          POSTGRES_DB: author_studio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TEST_DATABASE_URL: postgresql://app:apppw@localhost:5432/author_studio_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      # pnpm ставится первым: setup-node видит packageManager и включает кэш pnpm.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Форматирование, линтер, сборка, типы, unit-тесты, проверка миграций
        run: pnpm check
      - name: Интеграционные тесты (PostgreSQL 17, Redis 8)
        run: pnpm test:integration
      - name: Проверка конфигурации Docker Compose
        run: cp .env.example .env && docker compose config -q
      - name: Аудит зависимостей
        run: pnpm audit --prod --audit-level high

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Тестовая конфигурация
        run: |
          cp .env.example .env
          sed -i "s/^PUBLIC_DOMAIN=.*/PUBLIC_DOMAIN=localhost/" .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" .env
          sed -i "s|^APP_ENCRYPTION_KEY=.*|APP_ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env
      - name: Сборка образов
        run: docker compose build
      - name: Запуск всех сервисов
        run: docker compose up -d --wait --wait-timeout 180
      - name: Состояние приложения
        run: ./scripts/status.sh
      - name: Mini App и API через Caddy (HTTPS)
        run: |
          curl -fsSk https://localhost/ | grep -q 'lang="ru"'
          curl -fsSk https://localhost/api/health/ready
      - name: Резервная копия БД и медиафайлов
        run: ./scripts/backup.sh && ls -l backups
      - name: Том медиафайлов доступен процессу api на запись
        run: docker compose exec -T api sh -c 'touch /var/lib/author-studio/media/.probe && rm /var/lib/author-studio/media/.probe'
      - name: Миниатюры (sharp) работают в образе Alpine
        run: docker compose exec -T api node -e "import('sharp').then(async ({default:s})=>{const b=await s({create:{width:600,height:400,channels:3,background:'#0e9f8e'}}).webp().resize(480).toBuffer();console.log('sharp ok',b.length)})"
      - name: Миграции идемпотентны при перезапуске
        run: docker compose up -d --wait --wait-timeout 120 && docker compose logs migrate | grep -q 'Миграции применены'
      - name: Логи при ошибке
        if: failure()
        run: docker compose logs --tail=200
