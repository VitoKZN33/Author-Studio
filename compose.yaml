# Author Studio — установка на одном сервере.
# Запуск и обновление: ./scripts/update.sh (или docker compose up -d --build).
name: author-studio

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-server: &server
  build:
    context: .
    target: server
  image: author-studio-server:local
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://${POSTGRES_USER:-author_studio}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}@postgres:5432/${POSTGRES_DB:-author_studio}
    REDIS_URL: redis://redis:6379
    PUBLIC_URL: https://${PUBLIC_DOMAIN:?PUBLIC_DOMAIN не задан в .env}
    MEDIA_DIR: /var/lib/author-studio/media
  volumes:
    - media:/var/lib/author-studio/media
  networks: [backend, egress]
  logging: *logging

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-author_studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
      POSTGRES_DB: ${POSTGRES_DB:-author_studio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    logging: *logging

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # noeviction обязателен для BullMQ; AOF — задания переживают перезапуск Redis.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    logging: *logging

  # Одноразовый шаг: применяет миграции и завершается. API стартует только после успеха.
  migrate:
    <<: *server
    restart: 'no'
    command: ['node', 'dist/database/migrate.js']
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *server
    command: ['node', 'dist/main.api.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *server
    command: ['node', 'dist/main.worker.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'dist/worker/healthcheck.js']
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  caddy:
    build:
      context: .
      target: web
    image: author-studio-web:local
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN не задан в .env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL не задан в .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [egress]
    logging: *logging

networks:
  # Внутренняя сеть без выхода в интернет: PostgreSQL и Redis недоступны снаружи.
  backend:
    internal: true
  egress: {}

volumes:
  media:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
